spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://localhost:8888

# Sensible fallbacks if config-server is unreachable (so the service still starts standalone).
server:
  port: 8081
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
spring.datasource.url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
