# Used by @ActiveProfiles("test") in tests: disables the config-server import and Eureka
# registration so unit/slice tests don't try to reach services that aren't running.
spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:orderdb-test;DB_CLOSE_DELAY=-1
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
eureka:
  client:
    enabled: false
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 1
  timelimiter:
    instances:
      inventoryService:
        timeout-duration: 1s
