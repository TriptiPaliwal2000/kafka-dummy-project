# Shared defaults for every service that imports config from config-server.
# Service-specific files (order-service.yml, inventory-service.yml, notification-service.yml)
# override/add to this.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

spring:
  kafka:
    bootstrap-servers: localhost:9092

app:
  kafka:
    order-events-topic: order-events

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
